  /user/{id}/learning:
    get:
      tags: [Learning]
      summary: Get the user's learning profile
      description: Path, lifetime learning stats, milestone journey and history of previous paths.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Learning profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Learning]
      summary: Choose or change the learning path
      description: >-
        Progress is never lost: milestones read lifetime stats, so the new path may already have
        reached milestones (returned in `newMilestones`). The previous path is kept in the history.
        Display names and legacy spellings ("Deep Learner", "DeepLearner") are accepted.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  $ref: "#/components/schemas/LearningPathKey"
                focusField:
                  $ref: "#/components/schemas/Department"
              required: [path]
            example: { "path": "deep_learner", "focusField": "Chemistry" }
      responses:
        "200":
          description: Learning path updated (or unchanged)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum: [Learning path updated., Learning path unchanged.]
                  learning:
                    $ref: "#/components/schemas/LearningProfile"
                  newMilestones:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReachedMilestone"
        "400":
          description: Unknown or retired path (Career), or invalid focus field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
