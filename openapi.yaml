      properties:
        email:
          type: string
          format: email
          description: Must be unique (409 otherwise) and have a valid domain.
        password:
          type: string
          format: password
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        university:
          type: string
          description: Only stored for the Professor, PhD Student and Researcher roles.
        path:
          $ref: "#/components/schemas/LearningPathKey"
        focusField:
          type: string
          description: Deep Learner only (a department name).
        objective:
          deprecated: true
          description: Legacy name of `path`.
          allOf:
            - $ref: "#/components/schemas/Objective"
      required: [email, password, username, role]
    UserUpdate:
      type: object
      description: Fields a user may change on their own profile. All optional.
      properties:
        email:
          type: string
          format: email
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        university:
          type: string
        evaluation_list:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationItem"
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/Preference"
        castPublications:
          type: array
          items:
            type: string
        articlePublications:
          type: array
          items:
            type: string
    PasswordReset:
      type: object
      properties:
        password:
          type: string
          format: password
          minLength: 4
        confirmPassword:
          type: string
          format: password
      required: [password, confirmPassword]
    EvaluationItem:
      type: object
      properties:
        contentid:
          type: string
        type:
          type: string
        watched:
          type: boolean
        answered:
          type: boolean
    Bookmark:
      type: object
      properties:
        contentid:
          type: string
        type:
          type: string
          enum: [cast, article]
        bookmarkedAt:
          type: string
          format: date-time
    BookmarkExpanded:
      type: object
      properties:
        contentid:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
          enum: [cast, article]
        bookmarkedAt:
          type: string
          format: date-time
          nullable: true
        content:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/Cast"
            - $ref: "#/components/schemas/Article"
    BookmarkAddResponse:
      type: object
      properties:
        message:
          type: string
        bookmark:
          type: object
          properties:
            contentid:
              type: string
            type:
              type: string
              enum: [cast, article]
    Preference:
      type: object
      properties:
        category:
          type: string
        weight:
          type: number
        count:
          type: number
    UserTracking:
      type: object
      description: >-
        Legacy view of the learning path (app <= 1.0.5): `progress` / `target` sum the goals of the
        next milestone; `history` is the number of contents per department.
      properties:
        objective:
          type: string
        progress:
          type: number
        target:
          type: number
        history:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              count:
                type: number
    RewardBadge:
      type: object
      properties:
        key:
          type: string
          enum:
            [first_quiz, perfect_quiz, combo_5, streak_3, streak_7, correct_10, correct_50, quizzes_10, level_5, objective_reached]
        title:
          type: string
        description:
          type: string
        earned:
          type: boolean
        earnedAt:
          type: string
          format: date-time
          nullable: true
    Rewards:
      type: object
      description: Level 1 starts at 0 XP; reaching level n requires 50·n·(n−1) XP in total.
      properties:
        xp:
          type: number
        level:
          type: number
        levelTitle:
          type: string
        levelXp:
          type: number
          description: XP earned since the start of the current level.
        levelSpan:
          type: number
          description: XP between the current and the next level.
        nextLevelXp:
          type: number
        progress:
          type: number
          description: 0–1 progress toward the next level.
        streak:
          type: object
          properties:
            current:
              type: number
              description: Consecutive days with a quiz; 0 once a day was skipped.
            best:
              type: number
            completedToday:
              type: boolean
            lastQuizDay:
              type: string
              nullable: true
              example: "2026-11-10"
        stats:
          type: object
          properties:
            quizzesCompleted:
              type: number
            perfectQuizzes:
              type: number
            correctAnswers:
              type: number
            answeredQuestions:
              type: number
            bestCombo:
              type: number
        badges:
          type: array
          description: The full badge catalog with the user's progress.
          items:
            $ref: "#/components/schemas/RewardBadge"
    QuizResult:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              contentId:
                type: string
              correct:
                type: boolean
              correctAnswer:
                type: string
              department:
                type: string
              xp:
                type: number
        summary:
          type: object
          properties:
            total:
              type: number
            correct:
              type: number
            bestCombo:
              type: number
            perfect:
              type: boolean
        xpEarned:
          type: number
        breakdown:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                enum: [answers, effort, combo, perfect, streak]
              label:
                type: string
              xp:
                type: number
        previous:
          type: object
          description: XP and level before this quiz (to animate the progress).
          properties:
            xp:
              type: number
            level:
              type: number
            levelTitle:
              type: string
            levelXp:
              type: number
            levelSpan:
              type: number
            nextLevelXp:
              type: number
            progress:
              type: number
        leveledUp:
          type: boolean
        duplicate:
          type: boolean
          description: True when the `quizId` was already graded (nothing was awarded again).
        newBadges:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              title:
                type: string
              description:
                type: string
        newMilestones:
          type: array
          description: Learning path milestones reached thanks to this quiz.
          items:
            $ref: "#/components/schemas/ReachedMilestone"
        rewards:
          $ref: "#/components/schemas/Rewards"
