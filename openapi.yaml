openapi: 3.0.3
info:
  title: BrightMinds Backend API
  version: 1.0.0
  description: |
    OpenAPI specification for the BrightMinds backend.

    **Authentication.** Operations marked with `bearerAuth` expect an
    `Authorization: Bearer <token>` header, where the JWT is obtained from
    `POST /user/login`. Authentication is only enforced when the server runs with
    `AUTH_REQUIRED=true`; otherwise a missing or invalid token is ignored. When
    enforced, a missing or invalid/expired token yields `401`.

    **Own-account routes.** User routes that take the account id as `{id}`
    (profile update/delete, evaluation list, bookmarks, preferences, learning path,
    suggestions) additionally require the token's user to match `{id}`;
    otherwise the server answers `403` (also only when `AUTH_REQUIRED=true`).

    **Errors.** JSON errors use the `Error` schema: `{ "error": "...", "message": "..." }`.
    Both keys carry the same text, for backward compatibility with clients that read
    either one. Common cases: `400` for malformed ObjectIds, validation errors,
    malformed JSON bodies and malformed multipart JSON fields; `404` when a resource
    (or route) does not exist; `409` on duplicates; `413` when an upload or JSON
    body (1 MB) is too large; `500` for unexpected errors.
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.greenlights.us
    description: Production
tags:
  - name: System
  - name: Cast
  - name: User
  - name: Learning
  - name: University
  - name: VirtualLab
  - name: Topic
  - name: Atlas

paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      description: Reports whether the API is up and connected to the database.
      responses:
        "200":
          description: API and database are up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                db: up
        "503":
          description: Database is not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: degraded
                db: down

  # ------------------------------------------------------------------ Cast
  /cast:
    post:
      tags: [Cast]
      summary: Create a cast
      description: |
        Multipart upload of the video plus a `cast` form field holding a JSON-encoded
        `CastCreate` object. Duration is read from the video. The image is never generated: it
        is a frame of the video, at `thumbnailTime` (the moment the author chose) or picked
        automatically (most representative frame after the intro). Transcription, evaluation
        and (if no topic is given) topic generation run in a background queue.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                cast:
                  type: string
                  description: JSON-encoded `CastCreate` object.
                  example: '{"title":"My cast","brightmindid":"665f1c2e9b1e8a0012345678","university":"MIT","category":"Research","visibility":"public","department":"ComputerScience","thumbnailTime":12.5}'
                video:
                  type: string
                  format: binary
                  description: Video file (video/mp4, video/mpeg or video/webm, max 1024 MB).
              required: [cast, video]
            encoding:
              video:
                contentType: video/mp4, video/mpeg, video/webm
      responses:
        "201":
          description: Cast created; background processing started
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CreatedResponse"
                  - type: object
                    properties:
                      castimageurl:
                        type: string
                        nullable: true
                        description: The video thumbnail; null if no frame could be read.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    get:
      tags: [Cast]
      summary: List all casts
      description: Casts as cards (see `CastCard`), oldest first.
      responses:
        "200":
          description: List of casts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CastCard"
  /cast/all/simplified:
    get:
      tags: [Cast]
      summary: Get simplified cast list
      responses:
        "200":
          description: Count and simplified cast list
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  casts:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        title:
                          type: string
  /cast/trending/right/now:
    get:
      tags: [Cast]
      summary: Get trending casts
      description: All casts as cards (see `CastCard`), newest first.
      responses:
        "200":
          description: Trending casts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CastCard"
  /cast/popular/department:
    get:
      tags: [Cast]
      summary: Get most popular departments
      description: Number of casts per department, most popular first.
      responses:
        "200":
          description: Department popularity
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                      description: Department name
                    count:
                      type: integer
  /cast/category/{id}:
    get:
      tags: [Cast]
      summary: Get casts by category
      parameters:
        - $ref: "#/components/parameters/CategoryParam"
      responses:
        "200":
          description: List of casts (cards)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CastCard"
  /cast/department/{id}:
    get:
      tags: [Cast]
      summary: Get casts by department
      parameters:
        - $ref: "#/components/parameters/DepartmentParam"
        - name: topic
          in: query
          required: false
          description: Only return casts of this topic.
          schema:
            type: string
      responses:
        "200":
          description: List of casts (cards)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CastCard"
  /cast/brightmindid/{id}:
    get:
      tags: [Cast]
      summary: Get casts by creator (brightmindid)
      parameters:
        - $ref: "#/components/parameters/BrightmindIdParam"
      responses:
        "200":
          description: List of casts (cards)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CastCard"
  /cast/evaluation/{id}:
    get:
      tags: [Cast]
      summary: Get evaluation for a cast
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Evaluation
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluation:
                    $ref: "#/components/schemas/Evaluation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /cast/{id}:
    get:
      tags: [Cast]
      summary: Get cast by ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Cast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cast"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Cast]
      summary: Update cast (partial)
      description: |
        Partial update. Only the fields present in the `cast` JSON field are changed.
        An optional new `video` replaces the previous one (its duration is re-read, a new
        thumbnail is taken and the old files are deleted). `thumbnailTime` alone takes a new
        thumbnail from the current video. The image cannot be set directly.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                cast:
                  type: string
                  description: JSON-encoded `CastUpdate` object (fields to change).
                  example: '{"title":"New title","topic":"Machine Learning"}'
                video:
                  type: string
                  format: binary
                  description: Optional replacement video (video/mp4, video/mpeg or video/webm, max 1024 MB).
            encoding:
              video:
                contentType: video/mp4, video/mpeg, video/webm
      responses:
        "200":
          description: Cast updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: "`thumbnailTime` given but no frame of the video could be read (previous image kept)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Cast]
      summary: Delete cast
      description: Deletes the cast, its media files, user references and topic link.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Cast deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /cast/{id}/rating:
    get:
      tags: [Cast]
      summary: Get cast rating
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Rating
          content:
            application/json:
              schema:
                type: object
                properties:
                  rating:
                    $ref: "#/components/schemas/Rating"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Cast]
      summary: Rate a cast
      description: "`+` counts as a 10/10 vote, `-` as 0/10; averaged into `rating.value`."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingAction"
      responses:
        "200":
          description: Rating updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingUpdateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------------------ User
  /user/signup:
    post:
      tags: [User]
      summary: Create a user account
      description: |
        Multipart upload of the profile picture plus a `user` form field holding a
        JSON-encoded `UserSignup` object. The account is created and usable at once (the
        returned `token` can be used right away); a confirmation email is sent afterwards,
        and failing to send it never removes the account (`emailSent: false`: the user can
        ask for it again with `POST /user/{id}/verification/resend`). The password must
        follow the policy of `UserSignup`. Rate limited.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                user:
                  type: string
                  description: JSON-encoded `UserSignup` object.
                  example: '{"email":"jane@university.edu","password":"secret123","username":"jane","role":"Researcher","university":"MIT","path":"explorer"}'
                image:
                  type: string
                  format: binary
                  description: Profile picture (image/jpeg or image/png, max 10 MB).
              required: [user, image]
            encoding:
              image:
                contentType: image/jpeg, image/png
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /user/confirmation/{token}:
    get:
      tags: [User]
      summary: Confirm user email
      description: |
        Opened from the confirmation email; renders an HTML page. The link is valid for 72 hours.
        Opening it again once confirmed shows "already confirmed" (200).
      parameters:
        - $ref: "#/components/parameters/TokenParam"
      responses:
        "200":
          description: Email confirmed, or already confirmed (HTML page)
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Unknown, replaced, malformed or expired link (HTML page)
          content:
            text/html:
              schema:
                type: string
        "500":
          description: Server error (HTML page)
          content:
            text/html:
              schema:
                type: string
  /user/login:
    post:
      tags: [User]
      summary: Login
      description: |
        Returns the JWT to send as `Authorization: Bearer <token>`. Accounts whose email is not
        confirmed yet can log in (`isVerified: false`). An unknown email and a wrong password
        give the same 401. Rate limited: failed attempts only count (8 per account and address,
        60 per address, every 15 minutes).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required: [email, password]
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  email:
                    type: string
                  username:
                    type: string
                  role:
                    $ref: "#/components/schemas/Role"
                  isVerified:
                    type: boolean
                  token:
                    type: string
                    description: JWT for the `bearerAuth` scheme.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Incorrect email or password
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Incorrect email or password.
                  message:
                    type: string
                  response:
                    type: string
                    description: Same text, kept for older app versions.
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /user/{id}/verification/resend:
    post:
      tags: [User]
      summary: Resend the confirmation email
      description: |
        Sends a new confirmation link (the previous one stops working). Does nothing for an
        account that is already confirmed. At most one email per minute and 5 per hour for each
        account (429 with `retryAfterSeconds` and a `Retry-After` header).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Email sent (or the account is already confirmed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  emailStatus:
                    type: string
                    enum: [sent, pending, verified]
                  isVerified:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Too many emails requested
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  retryAfterSeconds:
                    type: integer
        "503":
          description: The email could not be sent right now; try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /user:
    get:
      tags: [User]
      summary: List users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /user/{id}:
    get:
      tags: [User]
      summary: Get user by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [User]
      summary: Update own user (partial)
      description: |
        Partial update of the authenticated user's own account. Send multipart
        (optional `image` + `user` JSON string) or a JSON body with the fields wrapped
        in a `user` object. Password and verification fields cannot be changed here.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                user:
                  type: string
                  description: JSON-encoded `UserUpdate` object (fields to change).
                  example: '{"username":"jane.doe"}'
                image:
                  type: string
                  format: binary
                  description: Optional new profile picture (image/jpeg or image/png, max 10 MB).
            encoding:
              image:
                contentType: image/jpeg, image/png
          application/json:
            schema:
              type: object
              properties:
                user:
                  $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      tags: [User]
      summary: Delete own user
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /user/reset-password-request:
    post:
      tags: [User]
      summary: Request password reset
      description: |
        Emails a reset link (valid for one hour, single use) when an account exists for the
        email. The answer is always the same 200, whether or not an account exists, so the
        endpoint cannot be used to discover accounts; unconfirmed accounts can reset too (which
        confirms their email). At most one email per minute and 5 per hour for each account.
        Rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required: [email]
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /user/reset-password/{token}:
    get:
      tags: [User]
      summary: Show reset password form
      description: Opened from the reset email; renders an HTML form.
      parameters:
        - $ref: "#/components/parameters/TokenParam"
      responses:
        "200":
          description: Reset form (HTML page)
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Invalid or expired link (HTML page)
          content:
            text/html:
              schema:
                type: string
        "500":
          description: Server error (HTML page)
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [User]
      summary: Reset password
      description: Submitted by the HTML reset form. Rate limited.
      parameters:
        - $ref: "#/components/parameters/TokenParam"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PasswordReset"
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordReset"
      responses:
        "200":
          description: Password updated (HTML page)
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Missing/mismatched/too weak password (the HTML form is shown again with the reason), or invalid, expired or already used link (HTML page)
          content:
            text/html:
              schema:
                type: string
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: Server error (HTML page)
          content:
            text/html:
              schema:
                type: string
  /user/add/content/{id}:
    post:
      tags: [User]
      summary: Add a cast to the evaluation list
      description: |
        Marks the cast as watched. The first time a cast is added, it counts in the user's
        learning stats (in total and for the cast's department), which may reach a milestone of
        the learning path (`newMilestones`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contentId:
                  type: string
                  description: Cast ObjectId.
              required: [contentId]
      responses:
        "200":
          description: Content added (or already in the list)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  newMilestones:
                    type: array
                    description: Only when the content was added for the first time.
                    items:
                      $ref: "#/components/schemas/ReachedMilestone"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /user/remove/content/{id}:
    post:
      tags: [User]
      summary: Remove content from evaluation list
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contentId:
                  type: string
              required: [contentId]
      responses:
        "200":
          description: Content removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /user/mark/content/as/answered/{id}:
    post:
      tags: [User]
      summary: Mark content as answered
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contentId:
                  type: string
              required: [contentId]
      responses:
        "200":
          description: Content marked as answered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: User not found, or content not in the evaluation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /user/{id}/quiz:
    post:
      tags: [User]
      summary: Submit quiz answers and earn rewards
      description: >-
        Grades the answers against the stored `evaluation.correct` of each cast and awards XP
        (+10 per correct answer, +2 per wrong answer, combo bonus +5 per consecutive correct answer up to +20,
        +20 for a perfect quiz of 2+ questions, daily streak bonus +5 per streak day up to +35 on the first
        quiz of the day), updates the daily streak, unlocks badges and counts the correct answers in the
        learning stats (which may reach a milestone: `newMilestones`). Only questions still pending in the
        user's evaluation list are graded; correct ones are marked as answered. Answers for other casts are
        ignored, so a replay earns nothing.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: array
                  minItems: 1
                  maxItems: 50
                  description: In the order they were answered (the order drives the combo bonus).
                  items:
                    type: object
                    properties:
                      contentId:
                        type: string
                      response:
                        type: string
                        description: The chosen answer, one of the evaluation `responses`.
                    required: [contentId, response]
                utcOffsetMinutes:
                  type: integer
                  minimum: -840
                  maximum: 840
                  description: Minutes east of UTC (e.g. 120 for UTC+2), so the streak follows the user's day.
                quizId:
                  type: string
                  pattern: "^[A-Za-z0-9_-]{8,64}$"
                  description: >-
                    Client-generated id of this quiz attempt. Resending the last graded quiz id (retry after a
                    lost response) earns nothing and answers `duplicate: true`.
              required: [answers]
      responses:
        "200":
          description: Graded quiz and updated rewards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The same quiz was submitted concurrently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /user/{id}/rewards:
    get:
      tags: [User]
      summary: Get the user's XP, level, streak and badges
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: utcOffsetMinutes
          in: query
          required: false
          schema:
            type: integer
            minimum: -840
            maximum: 840
          description: Minutes east of UTC, so the streak follows the user's day.
      responses:
        "200":
          description: Rewards
          content:
            application/json:
