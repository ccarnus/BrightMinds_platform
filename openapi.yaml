        "For You" casts, shaped by the learning path:
        - Follower: the newest casts from the preferred departments;
        - Explorer: the best-rated casts from departments not explored yet (at most 50), then the
          explored preferred departments;
        - Deep Learner: the focus field first, then the other preferred departments;
