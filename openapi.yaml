        "404":
          description: Virtual lab or institute not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /virtual/lab/{labId}/remove/institute/{instituteId}:
    delete:
      tags: [VirtualLab]
      summary: Remove institute
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LabIdParam"
        - $ref: "#/components/parameters/InstituteIdParam"
      responses:
        "200":
          description: Institute removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Virtual lab or institute not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /virtual/lab/{id}/add/topic:
    post:
      tags: [VirtualLab]
      summary: Add topic to virtual lab
      description: The new topic starts with empty `followers`, `members` and `threads`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VLTopicInput"
      responses:
        "200":
          description: Topic added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /virtual/lab/{labId}/update/topic/{topicId}:
    put:
      tags: [VirtualLab]
      summary: Update topic in virtual lab
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LabIdParam"
        - $ref: "#/components/parameters/LabTopicIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VLTopic"
      responses:
        "200":
          description: Topic updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Virtual lab or topic not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /virtual/lab/{labId}/remove/topic/{topicId}:
    delete:
      tags: [VirtualLab]
      summary: Remove topic from virtual lab
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LabIdParam"
        - $ref: "#/components/parameters/LabTopicIdParam"
      responses:
        "200":
          description: Topic removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Virtual lab or topic not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ------------------------------------------------------------------ Topic
  /topic:
    post:
      tags: [Topic]
      summary: Create topic (or return the existing one)
      description: |
        Topics are identified by (`name`, `departmentName`). If the topic already exists
        it is returned with status 200 (its `openalexID` is filled in if it had none);
        otherwise it is created (201).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                departmentName:
                  $ref: "#/components/schemas/Department"
                openalexID:
                  type: string
              required: [name, departmentName]
      responses:
        "201":
          description: Topic created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicResult"
        "200":
          description: Topic already existed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [Topic]
      summary: List topics
      description: |
        The topics shown in the app: those with casts, the hottest ones of each lab (`featured`) and
        the ones an author typed, hottest first. The whole catalog is browsed with `GET /atlas/topics`.
        Lists leave out the heavy fields (`keywords`, `series`, `signals`, `description`); `GET /topic/{id}` has them.
      responses:
        "200":
          description: Topics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"
  /topic/department/{departmentName}:
    get:
      tags: [Topic]
      summary: Get topics by department
      description: Same selection and order as `GET /topic`, for one lab.
      parameters:
        - name: departmentName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Topics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"
  /topic/{id}/progress:
    get:
      tags: [Topic]
      summary: How a topic is doing
      description: |
        Trend, phase and growth of the topic against its area, its output year by year and the
        independent signals (PubMed, arXiv, Wikipedia). The yearly series is fetched from OpenAlex on
        first use and then weekly; if OpenAlex cannot be reached the last known series is returned
        (empty at first). `ranked` is false for topics too small to rank (`hot` is then `null`).
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Topic progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicProgress"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /topic/{id}:
    get:
      tags: [Topic]
      summary: Get topic by ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Topic]
      summary: Update topic
      description: Only `name`, `departmentName` and `openalexID` can be changed; other fields are ignored.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicUpdate"
      responses:
        "200":
          description: Topic updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------------------ Atlas
  /atlas:
    get:
      tags: [Atlas]
      summary: The research atlas
      description: |
        The four domains and their 26 labs, with how many topics each lab has, how many are moving
        (rising or surging) and how many casts they hold. Hierarchy of the atlas: domain > lab (OpenAlex
        field) > area (OpenAlex subfield) > topic. `windowsEndOn` is the end of the 12-month windows the
        scores are computed on.
      responses:
        "200":
          description: Domains and labs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtlasOverview"
  /atlas/status:
    get:
      tags: [Atlas]
      summary: When the atlas was last refreshed
      responses:
        "200":
          description: Atlas status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtlasStatus"
  /atlas/hot:
    get:
      tags: [Atlas]
      summary: Hot topics
      description: |
        Topics whose research output grows faster than their area's, with statistical confidence
        (`trend` is `rising` or `surging`), hottest first. `trend=any` also lists steady, cooling and
        niche topics.
      parameters:
        - name: lab
          in: query
          schema:
            $ref: "#/components/schemas/Department"
        - name: area
          in: query
          description: OpenAlex subfield id (the `areaId` of a topic card).
          schema:
            type: integer
        - name: trend
          in: query
          schema:
            type: string
            enum: [any]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Hot topics
          content:
            application/json:
              schema:
                type: object
                properties:
                  topics:
                    type: array
                    items:
                      $ref: "#/components/schemas/TopicCard"
        "400":
          $ref: "#/components/responses/BadRequest"
  /atlas/topics:
    get:
      tags: [Atlas]
      summary: Browse and search the topics
      description: |
        All the topics of the catalog (not only the listed ones). Every word of `q` must appear in the
        name, a keyword or the area of the topic.
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: lab
          in: query
          schema:
            $ref: "#/components/schemas/Department"
        - name: area
          in: query
          description: OpenAlex subfield id.
          schema:
            type: integer
        - name: trend
          in: query
          schema:
            type: string
            enum: [surging, rising, steady, cooling, niche]
        - name: phase
          in: query
          schema:
            type: string
            enum: [emerging, growing, mature, declining]
        - name: sort
          in: query
          schema:
            type: string
            enum: [hot, growth, volume, casts, name]
            default: hot
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: A page of topics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  topics:
                    type: array
                    items:
                      $ref: "#/components/schemas/TopicCard"
        "400":
          $ref: "#/components/responses/BadRequest"
  /atlas/lab/{name}:
    get:
      tags: [Atlas]
      summary: A lab of the atlas
      description: The areas of the lab, its hot topics and the ones that are just emerging.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Department"
      responses:
        "200":
          description: Lab page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabAtlas"
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT returned by `POST /user/login` (`token` field). Only enforced when the server
        runs with `AUTH_REQUIRED=true`.
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: MongoDB ObjectId (24 hex characters). Malformed ids return 400.
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
    CategoryParam:
      name: id
      in: path
      required: true
      description: Category name.
      schema:
        type: string
    DepartmentParam:
      name: id
      in: path
      required: true
      description: Department name (see `Department`).
      schema:
        type: string
    BrightmindIdParam:
      name: id
      in: path
      required: true
      description: Creator id (`brightmindid`).
      schema:
        type: string
    TokenParam:
      name: token
      in: path
      required: true
      description: Token from the email link.
      schema:
        type: string
    LabIdParam:
      name: labId
      in: path
      required: true
      description: Virtual lab ObjectId (24 hex characters). Malformed ids return 400.
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
    InstituteIdParam:
      name: instituteId
      in: path
      required: true
      description: The institute's `instituteID` value (not the subdocument `_id`).
      schema:
        type: string
    LabTopicIdParam:
      name: topicId
      in: path
      required: true
      description: The virtual lab topic's subdocument `_id`.
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request (malformed id, validation error, malformed JSON / multipart JSON field, unsupported file type)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Invalid id.
            message: Invalid id.
    Unauthorized:
      description: Missing, invalid or expired token (only when `AUTH_REQUIRED=true`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Authentication required.
            message: Authentication required.
    Forbidden:
      description: The token's user does not match `{id}` (only when `AUTH_REQUIRED=true`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: You can only access your own account.
            message: You can only access your own account.
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Not found.
            message: Not found.
    Conflict:
      description: Resource already exists (e.g. duplicate cast title, signup email or virtual lab name)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Resource already exists.
            message: Resource already exists.
    PayloadTooLarge:
      description: Uploaded file exceeds the size limit (1024 MB for videos, 10 MB for images)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: File too large
            message: File too large
    TooManyRequests:
      description: Rate limit exceeded (20 requests per 15 minutes)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Too many attempts, please try again later.
            message: Too many attempts, please try again later.
    InternalServerError:
      description: Unexpected server error (e.g. email could not be sent)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      description: Error body. `error` and `message` carry the same text (backward compatibility).
      properties:
        error:
          type: string
        message:
          type: string
      required: [error, message]
    MessageResponse:
      type: object
      description: Success message; endpoints use either `message` or `response`.
      properties:
        message:
          type: string
        response:
          type: string
    CreatedResponse:
      type: object
      properties:
        response:
          type: string
        id:
          type: string
          description: ObjectId of the created resource.
      required: [response, id]
    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        db:
          type: string
          enum: [up, down]
    Department:
      type: string
      enum:
        - Medicine
        - SocialSciences
        - Engineering
        - ArtsandHumanities
        - ComputerScience
        - BiochemistryGeneticsandMolecularBiology
        - AgriculturalandBiologicalSciences
        - EnvironmentalScience
        - MaterialsScience
        - PhysicsandAstronomy
        - BusinessManagementandAccounting
        - HealthProfessions
        - EconomicsEconometricsandFinance
        - Psychology
        - Chemistry
        - EarthandPlanetarySciences
        - Neuroscience
        - Mathematics
        - ImmunologyandMicrobiology
        - DecisionSciences
        - Energy
        - Nursing
        - PharmacologyToxicologyandPharmaceutics
        - Dentistry
        - ChemicalEngineering
        - Veterinary
    Objective:
      type: string
      description: Legacy learning path display name (use `LearningPathKey`). "DeepLearner" is also accepted.
      enum: [Follower, Explorer, Deep Learner, Researcher]
    LearningPathKey:
      type: string
      description: Stable path identifier. Display names are accepted on input; Career was retired.
      enum: [follower, explorer, deep_learner, researcher]
    LearningMetric:
      type: string
      description: >-
        casts = casts watched, correctAnswers = quiz questions answered
        correctly, fields = departments explored, papers = research papers opened.
      enum: [casts, correctAnswers, fields, papers]
    LearningGoal:
      type: object
      properties:
        metric:
          $ref: "#/components/schemas/LearningMetric"
        label:
          type: string
        target:
          type: number
        current:
          type: number
          description: Lifetime value (may exceed the target). Only in a user's journey.
    LearningPath:
      type: object
      properties:
        key:
          $ref: "#/components/schemas/LearningPathKey"
        title:
          type: string
        tagline:
          type: string
        description:
          type: string
        feed:
          type: string
          description: How the path shapes the "For You" suggestions.
        usesFocusField:
          type: boolean
          description: Deep Learner measures a single focus field.
        milestones:
          type: array
          items:
            type: object
            properties:
              level:
                type: number
              title:
                type: string
              goals:
                type: array
                items:
                  $ref: "#/components/schemas/LearningGoal"
    LearningMilestone:
      type: object
      properties:
        level:
          type: number
        title:
          type: string
        goals:
          type: array
          items:
            $ref: "#/components/schemas/LearningGoal"
        progress:
          type: number
          description: Average completion of the goals (0-1).
        reached:
          type: boolean
        reachedAt:
          type: string
          format: date-time
          nullable: true
    ReachedMilestone:
      type: object
      properties:
        path:
          $ref: "#/components/schemas/LearningPathKey"
        pathTitle:
          type: string
        focusField:
          type: string
          nullable: true
        level:
          type: number
        title:
          type: string
        total:
          type: number
        reachedAt:
          type: string
          format: date-time
    LearningProfile:
      type: object
      properties:
        path:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/LearningPathKey"
          description: Null until the user picks a path.
        title:
          type: string
          nullable: true
        tagline:
          type: string
          nullable: true
        focusField:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        stats:
          type: object
          description: Lifetime learning activity (never reset).
          properties:
            casts:
              type: number
            correctAnswers:
              type: number
            papers:
              type: number
            fieldsExplored:
              type: number
            fields:
              type: array
              description: Per department, most active first.
              items:
                type: object
                properties:
                  field:
                    type: string
                  casts:
                    type: number
                  correctAnswers:
                    type: number
                  papers:
                    type: number
        journey:
          type: object
          nullable: true
          description: Null without a path.
          properties:
            level:
              type: number
              description: Milestones reached.
            total:
              type: number
            completed:
              type: boolean
            next:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/LearningMilestone"
            milestones:
              type: array
              items:
                $ref: "#/components/schemas/LearningMilestone"
        history:
          type: array
          description: Previous paths, most recent first (20 at most).
          items:
            type: object
            properties:
              path:
                type: string
              title:
                type: string
              focusField:
                type: string
                nullable: true
              startedAt:
                type: string
                format: date-time
                nullable: true
              endedAt:
                type: string
                format: date-time
              milestonesReached:
                type: number
    Role:
      type: string
      enum: [College Student, Professor, Researcher, Learning Enthusiast, PhD Student]
    Rating:
      type: object
      properties:
        value:
          type: number
          minimum: 0
          maximum: 10
        count:
          type: integer
    RatingAction:
      type: object
      properties:
        action:
          type: string
          enum: ["+", "-"]
      required: [action]
    RatingUpdateResponse:
      type: object
      properties:
        message:
          type: string
        rating:
          $ref: "#/components/schemas/Rating"
    Evaluation:
      type: object
      properties:
        question:
          type: string
        responses:
          type: array
          items:
            type: string
        correct:
          type: string
    Cast:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        description:
          type: string
        department:
          type: string
        brightmindid:
          type: string
        casturl:
          type: string
        castimageurl:
          type: string
          description: >-
            A frame of the video (`thumb_*.jpg`), chosen by the author or picked automatically.
            Absent when no frame could be read.
        university:
          type: string
        category:
          type: string
        visibility:
          type: string
        link:
          type: string
        duration:
          type: number
        dateadded:
          type: string
          format: date-time
        rating:
          $ref: "#/components/schemas/Rating"
        evaluation:
          $ref: "#/components/schemas/Evaluation"
        topic:
          type: string
        subtitleurl:
          type: string
        processing:
          $ref: "#/components/schemas/Processing"
    CastCard:
      type: object
      description: >-
        A cast as returned by the list endpoints, the feed and expanded bookmarks: like `Cast`
        without `description` (the transcript), `evaluation` and `processing`, which only come with
        `GET /cast/{id}` (the quiz question with `GET /cast/evaluation/{id}`).
      properties:
        _id:
          type: string
        title:
          type: string
        department:
          type: string
        brightmindid:
          type: string
        casturl:
          type: string
        castimageurl:
          type: string
        university:
          type: string
        category:
          type: string
        visibility:
          type: string
        link:
          type: string
        duration:
          type: number
        dateadded:
          type: string
          format: date-time
        rating:
          $ref: "#/components/schemas/Rating"
        topic:
          type: string
        subtitleurl:
          type: string
    Processing:
      type: object
      description: |
        Background AI processing (transcript, subtitles, evaluation, department, topic; images
        are never generated).
        Failed steps are retried with backoff, then once a day; `failed` means the item itself
        could not be processed after several days and needs attention.
      properties:
        status:
          type: string
          enum: [pending, processing, done, failed]
        attempts:
          type: integer
          description: Failures caused by the item itself (OpenAI outages are not counted).
        lastError:
          type: string
        lastAttemptAt:
          type: string
          format: date-time
    CastCreate:
      type: object
      description: Content of the `cast` multipart field for `POST /cast`.
      properties:
        title:
          type: string
          maxLength: 85
          description: Must be unique (409 otherwise).
        brightmindid:
          type: string
        university:
          type: string
        category:
          type: string
        visibility:
          type: string
        link:
          type: string
        department:
          allOf:
            - $ref: "#/components/schemas/Department"
          description: Optional; left empty, the cast is stored with `Pending Department`.
        topic:
          type: string
          description: Optional; when omitted the topic (and department) are generated in the background.
        thumbnailTime:
          type: number
          minimum: 0
          description: >-
            Moment of the video (seconds) used as the cast's image. Omitted: the most
            representative frame after the intro is picked automatically.
        dateadded:
          type: string
          format: date-time
      required: [title, brightmindid, university, category, visibility]
    CastUpdate:
      type: object
      description: Content of the `cast` multipart field for `PUT /cast/{id}`. All fields optional.
      properties:
        title:
          type: string
          maxLength: 85
        description:
          type: string
        brightmindid:
          type: string
        university:
          type: string
        category:
          type: string
        visibility:
          type: string
        link:
          type: string
        thumbnailTime:
          type: number
          minimum: 0
          description: >-
            New moment of the video (seconds) for the image. With a new video and no
            `thumbnailTime`, the thumbnail is picked automatically.
        department:
          $ref: "#/components/schemas/Department"
        topic:
          type: string
        dateadded:
          type: string
          format: date-time
    User:
      type: object
      description: Public user representation (credentials and tokens are never returned).
      properties:
        _id:
          type: string
        email:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        university:
          type: string
        profilePictureUrl:
          type: string
        isVerified:
          type: boolean
        evaluation_list:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationItem"
        bookmarkedcontent:
          type: array
          items:
            $ref: "#/components/schemas/Bookmark"
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/Preference"
        learning:
          type: object
          description: Raw learning data; use `GET /user/{id}/learning` for the journey and history.
        castPublications:
          type: array
          items:
            type: string
        rewards:
          type: object
          description: Raw reward counters; use `GET /user/{id}/rewards` for levels, streak and badges.
    SignupResponse:
      type: object
      properties:
        response:
          type: string
          description: Message to show the user.
        userId:
          type: string
        email:
          type: string
        token:
          type: string
          description: JWT; the new user can use the app right away, before confirming the email.
        isVerified:
          type: boolean
          example: false
        emailSent:
          type: boolean
          description: False when the confirmation email could not be sent (the user can resend it).
        emailStatus:
          type: string
          enum: [sent, pending, failed]
          description: "`pending` when the provider is slow; the email is still on its way."
    UserSignup:
      type: object
      description: Content of the `user` multipart field for `POST /user/signup`.
      properties:
        email:
          type: string
          format: email
          description: Must be unique (409 otherwise, whatever the capital letters) and well formed.
        password:
          type: string
          format: password
          minLength: 8
          description: |
            8 to 72 bytes; not only spaces, not a very common password, not equal to the email
            or the name.
        username:
          type: string
          minLength: 2
          maxLength: 50
        role:
          $ref: "#/components/schemas/Role"
        university:
          type: string
          description: Only stored for the Professor, PhD Student and Researcher roles.
        path:
          $ref: "#/components/schemas/LearningPathKey"
        focusField:
          type: string
          description: Deep Learner only (a department name).
        objective:
          deprecated: true
          description: Legacy name of `path`.
          allOf:
            - $ref: "#/components/schemas/Objective"
      required: [email, password, username, role]
    UserUpdate:
      type: object
      description: Fields a user may change on their own profile. All optional.
      properties:
        email:
          type: string
          format: email
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        university:
          type: string
        evaluation_list:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationItem"
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/Preference"
        castPublications:
          type: array
          items:
            type: string
    PasswordReset:
      type: object
      properties:
        password:
          type: string
          format: password
          minLength: 4
        confirmPassword:
          type: string
          format: password
      required: [password, confirmPassword]
    EvaluationItem:
      type: object
      properties:
        contentid:
          type: string
          description: Cast ObjectId.
        watched:
          type: boolean
        answered:
          type: boolean
    Bookmark:
      type: object
      properties:
        contentid:
          type: string
          description: Cast ObjectId.
        bookmarkedAt:
          type: string
          format: date-time
    BookmarkExpanded:
      type: object
      properties:
        contentid:
          type: string
          nullable: true
        bookmarkedAt:
          type: string
          format: date-time
          nullable: true
        content:
          nullable: true
          description: The bookmarked cast as a card; null when the cast was deleted.
          allOf:
            - $ref: "#/components/schemas/CastCard"
    BookmarkAddResponse:
      type: object
      properties:
        message:
          type: string
        bookmark:
          type: object
          properties:
            contentid:
              type: string
    Preference:
      type: object
      properties:
        category:
          type: string
        weight:
          type: number
        count:
          type: number
    UserTracking:
      type: object
      description: >-
        Legacy view of the learning path (app <= 1.0.5): `progress` / `target` sum the goals of the
        next milestone; `history` is the number of casts watched per department.
      properties:
        objective:
          type: string
        progress:
          type: number
        target:
          type: number
        history:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              count:
                type: number
    RewardBadge:
      type: object
      properties:
        key:
          type: string
          enum:
            [first_quiz, perfect_quiz, combo_5, streak_3, streak_7, correct_10, correct_50, quizzes_10, level_5, objective_reached]
        title:
          type: string
        description:
          type: string
        earned:
          type: boolean
        earnedAt:
          type: string
          format: date-time
          nullable: true
    Rewards:
      type: object
      description: Level 1 starts at 0 XP; reaching level n requires 50·n·(n−1) XP in total.
      properties:
        xp:
          type: number
        level:
          type: number
        levelTitle:
          type: string
        levelXp:
          type: number
          description: XP earned since the start of the current level.
        levelSpan:
          type: number
          description: XP between the current and the next level.
        nextLevelXp:
          type: number
        progress:
          type: number
          description: 0–1 progress toward the next level.
        streak:
          type: object
          properties:
            current:
              type: number
              description: Consecutive days with a quiz; 0 once a day was skipped.
            best:
              type: number
            completedToday:
              type: boolean
            lastQuizDay:
              type: string
              nullable: true
              example: "2026-11-10"
        stats:
          type: object
          properties:
            quizzesCompleted:
              type: number
            perfectQuizzes:
              type: number
            correctAnswers:
              type: number
            answeredQuestions:
              type: number
            bestCombo:
              type: number
        badges:
          type: array
          description: The full badge catalog with the user's progress.
          items:
            $ref: "#/components/schemas/RewardBadge"
    QuizResult:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              contentId:
                type: string
              correct:
                type: boolean
              correctAnswer:
                type: string
              department:
                type: string
              xp:
                type: number
        summary:
          type: object
          properties:
            total:
              type: number
            correct:
              type: number
            bestCombo:
              type: number
            perfect:
              type: boolean
        xpEarned:
          type: number
        breakdown:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                enum: [answers, effort, combo, perfect, streak]
              label:
                type: string
              xp:
                type: number
        previous:
          type: object
          description: XP and level before this quiz (to animate the progress).
          properties:
            xp:
              type: number
            level:
              type: number
            levelTitle:
              type: string
            levelXp:
              type: number
            levelSpan:
              type: number
            nextLevelXp:
              type: number
            progress:
              type: number
        leveledUp:
          type: boolean
        duplicate:
          type: boolean
          description: True when the `quizId` was already graded (nothing was awarded again).
        newBadges:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              title:
                type: string
              description:
                type: string
        newMilestones:
          type: array
          description: Learning path milestones reached thanks to this quiz.
          items:
            $ref: "#/components/schemas/ReachedMilestone"
        rewards:
          $ref: "#/components/schemas/Rewards"
    University:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        displayedName:
          type: string
        iconurl:
          type: string
    UniversityInput:
      type: object
      properties:
        name:
          type: string
        displayedName:
          type: string
        iconurl:
          type: string
          description: Only used by `PUT` when no icon file is uploaded.
    VirtualLab:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        followers:
          type: array
          items:
            $ref: "#/components/schemas/VLUserRef"
        members:
          type: array
          items:
            $ref: "#/components/schemas/VLUserRef"
        institute:
          type: array
          items:
            $ref: "#/components/schemas/VLInstitute"
        topics:
          type: array
          items:
            $ref: "#/components/schemas/VLTopic"
        iconurl:
          type: string
        colorcode:
          type: string
        research:
          type: object
          description: Filled in by the weekly OpenAlex refresh (see `GET /virtual/lab/overview`).
          properties:
            works12m:
              type: integer
              nullable: true
            level:
              type: number
              nullable: true
            updatedAt:
              type: string
              format: date-time
              nullable: true
    LabOverview:
      type: object
      properties:
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the research volumes were last refreshed (oldest lab).
        labs:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Department key, e.g. `ComputerScience`.
              works12m:
                type: integer
                nullable: true
                description: Works published in the last 12 months (OpenAlex).
              level:
                type: number
                nullable: true
                description: 0-100, log scale of `works12m`; sizes the lab on the map.
              casts:
                type: integer
              topics:
                type: integer
                description: Topics listed in the app for the lab (with casts, the hottest, author-made).
              catalog:
                type: integer
                description: Topics the research atlas knows in the lab.
              hot:
                type: integer
                description: Topics of the lab that are rising or surging.
    VirtualLabInput:
      type: object
      properties:
        name:
          type: string
          description: Must be unique (409 otherwise).
        followers:
          type: array
          items:
            $ref: "#/components/schemas/VLUserRef"
        members:
          type: array
          items:
            $ref: "#/components/schemas/VLUserRef"
        topics:
          type: array
          items:
            $ref: "#/components/schemas/VLTopic"
        colorcode:
          type: string
        iconurl:
          type: string
          description: Only used by `PUT` when no icon file is uploaded.
    VLUserRef:
      type: object
      properties:
        userID:
          type: string
    VLInstitute:
      type: object
      properties:
        instituteID:
          type: string
        score:
          type: number
    VLTopic:
      type: object
      properties:
        _id:
          type: string
          readOnly: true
        name:
          type: string
        gage:
          type: number
        institutes:
          type: array
          items:
            type: object
            properties:
              instituteId:
                type: string
        description:
          type: string
        followers:
          type: array
          items:
            $ref: "#/components/schemas/VLUserRef"
        members:
          type: array
          items:
            $ref: "#/components/schemas/VLUserRef"
        threads:
          type: array
          items:
            type: object
            properties:
              content:
                type: string
    VLTopicInput:
      type: object
      properties:
        name:
          type: string
        gage:
          type: number
          default: 0
        institutes:
          type: array
          items:
            type: object
            properties:
              instituteId:
                type: string
        description:
          type: string
      required: [name]
    Topic:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        departmentName:
          type: string
        castCount:
          type: integer
        castIDs:
          type: array
          items:
            type: string
        openalexID:
          type: string
        source:
          type: string
          enum: [openalex, author]
          description: |
            `openalex` topics belong to the catalog (they exist with or without casts); `author` topics
            were typed by an author and disappear with their last cast.
        originalName:
          type: string
          description: The name OpenAlex gives the topic.
        description:
          type: string
        subfield:
          type: object
          description: The area of the topic (OpenAlex subfield).
          properties:
            id:
              type: integer
            name:
              type: string
        keywords:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              score:
                type: number
        ids:
          type: object
          description: Identifiers of the same topic on other platforms, to cross-reference them.
          properties:
            wikipedia:
              type: string
              nullable: true
              description: English Wikipedia page title.
            wikidata:
              type: string
              nullable: true
              description: Wikidata item, e.g. `Q12204`. Filled in for the tracked topics.
            mesh:
              type: string
              nullable: true
              description: MeSH descriptor id (PubMed). An empty string means none was found.
            meshLabel:
              type: string
              nullable: true
        anchor:
          type: string
          enum: [match, loose, shared]
          description: Whether the Wikipedia page really is about this topic (only `match` feeds the attention signal).
        retired:
          type: boolean
          description: The topic left the OpenAlex catalog. It stays while casts use it.
        featured:
          type: boolean
          description: One of the hottest topics of its lab, listed in the app even without casts.
        activity:
          type: number
          description: 0-100, how much is published on the topic compared to the other topics of its lab.
        impact:
          type: number
          description: 0-100, how much of the topic's output is highly cited compared to the other topics of its lab.
        metrics:
          type: object
          properties:
            openalex:
              type: object
              properties:
                citedByCount:
                  type: number
                worksCount:
                  type: number
                worksLast12Months:
                  type: number
                  description: Works in the latest 12-month window (the same as `score.works12m`).
                lastFetchedAt:
                  type: string
                  format: date-time
                  nullable: true
        score:
          type: object
          description: |
            Computed by the weekly atlas refresh from rolling 12-month windows of OpenAlex works
            (articles and reviews), the latest one ending at least 30 days ago. Counts of 0 and
            `null` mean the topic was not scored yet.
          properties:
            hot:
              type: number
              nullable: true
              description: 0-100 among the ranked topics of the lab; `null` for topics too small to rank.
            hotBase:
              type: number
              nullable: true
              description: The hot score before the independent signals are blended in.
            trend:
              type: string
              nullable: true
              enum: [surging, rising, steady, cooling, niche]
              description: |
                Growth against the topic's area, with confidence. `surging` and `rising`: the
                lower bound of the credible interval is above the area's trend; `cooling`: the upper
                bound is below it; `niche`: too few works to tell.
            phase:
              type: string
              nullable: true
              enum: [emerging, growing, mature, declining]
            works12m:
              type: integer
            windows:
              type: object
              description: Works in the latest window (`c0`), the one before (`c1`) and the one before that (`c2`); `top` is the number of top-10% cited works in the matured window.
              properties:
                c0:
                  type: integer
                c1:
                  type: integer
                c2:
                  type: integer
                top:
                  type: integer
            yoy:
              type: number
              nullable: true
              description: Raw change of `c0` over `c1` (0.2 = +20%).
            growth:
              type: object
              description: Shrunk growth against the area (1 = like the area), its credible interval and the expected count.
              properties:
                rate:
                  type: number
                lower:
                  type: number
                upper:
                  type: number
                expected:
                  type: number
            acceleration:
              type: number
              nullable: true
              description: Whether growth itself is speeding up (positive) or slowing down.
            impact:
              type: object
              properties:
                share:
                  type: number
                  description: Share of the topic's works that are in the top 10% most cited of their year.
                lower:
                  type: number
                level:
                  type: number
            levels:
              type: object
              description: 0-100 percentiles within the lab.
              properties:
                growth:
                  type: number
                acceleration:
                  type: number
                impact:
                  type: number
                volume:
                  type: number
            signalLevel:
              type: number
              nullable: true
              description: 0-100, from the independent signals; `null` without any.
            endsOn:
              type: string
              nullable: true
              description: End of the latest window (`YYYY-MM-DD`).
            computedAt:
              type: string
              format: date-time
              nullable: true
        signals:
          type: object
          description: Independent cross-checks for the tracked topics.
          properties:
            wikipedia:
              $ref: "#/components/schemas/TopicSignal"
            pubmed:
              $ref: "#/components/schemas/TopicSignal"
            arxiv:
              $ref: "#/components/schemas/TopicSignal"
            computedAt:
              type: string
              format: date-time
              nullable: true
        series:
          type: object
          properties:
            yearly:
              type: array
              items:
                type: object
                properties:
                  year:
                    type: integer
                  works:
                    type: integer
            fetchedAt:
              type: string
              format: date-time
              nullable: true
    TopicSignal:
      type: object
      description: Works (PubMed, arXiv) or page views (Wikipedia) in the latest window and the one before.
      properties:
        current:
          type: number
        previous:
          type: number
        ratio:
          type: number
          description: Smoothed ratio `current / previous`.
        level:
          type: number
          description: 0-100 among the tracked topics of the lab.
        query:
          type: string
        fetchedAt:
          type: string
          format: date-time
    TopicCard:
      type: object
      description: A topic as a list item.
      properties:
        id:
          type: string
        name:
          type: string
        lab:
          $ref: "#/components/schemas/Department"
        area:
          type: string
          nullable: true
        areaId:
          type: integer
          nullable: true
        hot:
          type: number
          nullable: true
        trend:
          type: string
          nullable: true
          enum: [surging, rising, steady, cooling, niche]
        phase:
          type: string
          nullable: true
          enum: [emerging, growing, mature, declining]
        works12m:
          type: integer
        change:
          type: number
          nullable: true
          description: Change over the previous 12 months (0.2 = +20%).
        versusArea:
          type: number
          nullable: true
          description: Growth against the topic's area (1 = like the area).
        acceleration:
          type: number
          nullable: true
        castCount:
          type: integer
        keywords:
          type: array
          description: The first three keywords.
          items:
            type: string
    TopicProgress:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        lab:
          $ref: "#/components/schemas/Department"
        area:
          type: string
          nullable: true
        scored:
          type: boolean
        ranked:
          type: boolean
        trend:
          type: string
          nullable: true
          enum: [surging, rising, steady, cooling, niche]
        phase:
          type: string
          nullable: true
          enum: [emerging, growing, mature, declining]
        hot:
          type: number
          nullable: true
        works12m:
          type: integer
        previous12m:
          type: integer
          nullable: true
        change:
          type: number
          nullable: true
        versusArea:
          type: number
          nullable: true
        versusAreaRange:
          type: array
          nullable: true
          description: Credible interval of `versusArea`, `[lower, upper]`.
          items:
            type: number
        acceleration:
          type: number
          nullable: true
        topCitedShare:
          type: number
          nullable: true
          description: Share of the works in the top 10% most cited.
        levels:
          type: object
          description: 0-100 percentiles within the lab.
          properties:
            volume:
              type: number
              nullable: true
            impact:
              type: number
              nullable: true
            attention:
              type: number
              nullable: true
              description: From Wikipedia page views.
        yearly:
          type: array
          items:
            type: object
            properties:
              year:
                type: integer
              works:
                type: integer
              partial:
                type: boolean
                description: The year is not over, so `works` is still growing.
        signals:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
                enum: [pubmed, arxiv, wikipedia]
              current:
                type: number
              previous:
                type: number
              ratio:
                type: number
        windowsEndOn:
          type: string
          nullable: true
        computedAt:
          type: string
          format: date-time
          nullable: true
    AtlasOverview:
      type: object
      properties:
        updatedAt:
          type: string
          format: date-time
          nullable: true
        windowsEndOn:
          type: string
          nullable: true
        domains:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              labs:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      $ref: "#/components/schemas/Department"
                    topics:
                      type: integer
                    hot:
                      type: integer
                    casts:
                      type: integer
    LabAtlas:
      type: object
      properties:
