  # ------------------------------------------------------------------ Topic
  /topic:
    post:
      tags: [Topic]
      summary: Create topic (or return the existing one)
      description: |
        Topics are identified by (`name`, `departmentName`). If the topic already exists
        it is returned with status 200 (its `openalexID` is filled in if it had none);
        otherwise it is created (201).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                departmentName:
                  $ref: "#/components/schemas/Department"
                openalexID:
                  type: string
              required: [name, departmentName]
      responses:
        "201":
          description: Topic created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicResult"
        "200":
          description: Topic already existed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [Topic]
      summary: List topics
      responses:
        "200":
          description: Topics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"
  /topic/department/{departmentName}:
    get:
      tags: [Topic]
      summary: Get topics by department
      parameters:
        - name: departmentName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Topics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"
  /topic/{id}:
    get:
      tags: [Topic]
      summary: Get topic by ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Topic]
      summary: Update topic
      description: Only `name`, `departmentName` and `openalexID` can be changed; other fields are ignored.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicUpdate"
      responses:
        "200":
          description: Topic updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT returned by `POST /user/login` (`token` field). Only enforced when the server
        runs with `AUTH_REQUIRED=true`.
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: MongoDB ObjectId (24 hex characters). Malformed ids return 400.
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
    CategoryParam:
      name: id
      in: path
      required: true
      description: Category name.
      schema:
        type: string
    DepartmentParam:
      name: id
      in: path
      required: true
      description: Department name (see `Department`).
      schema:
        type: string
    BrightmindIdParam:
      name: id
      in: path
      required: true
      description: Creator id (`brightmindid`).
      schema:
        type: string
    TokenParam:
      name: token
      in: path
      required: true
      description: Token from the email link.
      schema:
        type: string
    LabIdParam:
      name: labId
      in: path
      required: true
      description: Virtual lab ObjectId (24 hex characters). Malformed ids return 400.
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
    InstituteIdParam:
      name: instituteId
      in: path
      required: true
      description: The institute's `instituteID` value (not the subdocument `_id`).
      schema:
        type: string
    LabTopicIdParam:
      name: topicId
      in: path
      required: true
      description: The virtual lab topic's subdocument `_id`.
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request (malformed id, validation error, malformed JSON / multipart JSON field, unsupported file type)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Invalid id.
            message: Invalid id.
    Unauthorized:
      description: Missing, invalid or expired token (only when `AUTH_REQUIRED=true`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Authentication required.
            message: Authentication required.
    Forbidden:
      description: The token's user does not match `{id}` (only when `AUTH_REQUIRED=true`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: You can only access your own account.
            message: You can only access your own account.
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Not found.
            message: Not found.
    Conflict:
      description: Resource already exists (e.g. duplicate cast title, signup email or virtual lab name)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Resource already exists.
            message: Resource already exists.
    PayloadTooLarge:
      description: Uploaded file exceeds the size limit (1024 MB for videos, 10 MB for images)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: File too large
            message: File too large
    TooManyRequests:
      description: Rate limit exceeded (20 requests per 15 minutes)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Too many attempts, please try again later.
            message: Too many attempts, please try again later.
    InternalServerError:
      description: Unexpected server error (e.g. email could not be sent)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      description: Error body. `error` and `message` carry the same text (backward compatibility).
      properties:
        error:
          type: string
        message:
          type: string
      required: [error, message]
    MessageResponse:
      type: object
      description: Success message; endpoints use either `message` or `response`.
      properties:
        message:
          type: string
        response:
          type: string
    CreatedResponse:
      type: object
      properties:
        response:
          type: string
        id:
          type: string
          description: ObjectId of the created resource.
      required: [response, id]
    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        db:
          type: string
          enum: [up, down]
    Department:
      type: string
      enum:
        - Medicine
        - SocialSciences
        - Engineering
        - ArtsandHumanities
        - ComputerScience
        - BiochemistryGeneticsandMolecularBiology
        - AgriculturalandBiologicalSciences
        - EnvironmentalScience
        - MaterialsScience
        - PhysicsandAstronomy
        - BusinessManagementandAccounting
        - HealthProfessions
        - EconomicsEconometricsandFinance
        - Psychology
        - Chemistry
        - EarthandPlanetarySciences
        - Neuroscience
        - Mathematics
        - ImmunologyandMicrobiology
        - DecisionSciences
        - Energy
        - Nursing
        - PharmacologyToxicologyandPharmaceutics
        - Dentistry
        - ChemicalEngineering
        - Veterinary
    Objective:
      type: string
      description: Legacy learning path display name (use `LearningPathKey`). "DeepLearner" is also accepted.
      enum: [Follower, Explorer, Deep Learner, Researcher]
    LearningPathKey:
      type: string
      description: Stable path identifier. Display names are accepted on input; Career was retired.
      enum: [follower, explorer, deep_learner, researcher]
    LearningMetric:
      type: string
      description: >-
        contents = casts watched and articles read, correctAnswers = quiz questions answered
        correctly, fields = departments explored, papers = research papers opened.
      enum: [contents, correctAnswers, fields, papers]
    LearningGoal:
      type: object
      properties:
        metric:
          $ref: "#/components/schemas/LearningMetric"
        label:
          type: string
        target:
          type: number
        current:
          type: number
          description: Lifetime value (may exceed the target). Only in a user's journey.
    LearningPath:
      type: object
      properties:
        key:
          $ref: "#/components/schemas/LearningPathKey"
        title:
          type: string
        tagline:
          type: string
        description:
          type: string
        feed:
          type: string
          description: How the path shapes the "For You" suggestions.
        usesFocusField:
          type: boolean
          description: Deep Learner measures a single focus field.
        milestones:
          type: array
          items:
            type: object
            properties:
              level:
                type: number
              title:
                type: string
              goals:
                type: array
                items:
                  $ref: "#/components/schemas/LearningGoal"
    LearningMilestone:
      type: object
      properties:
        level:
          type: number
        title:
          type: string
        goals:
          type: array
          items:
            $ref: "#/components/schemas/LearningGoal"
        progress:
          type: number
          description: Average completion of the goals (0-1).
        reached:
          type: boolean
        reachedAt:
          type: string
          format: date-time
          nullable: true
    ReachedMilestone:
      type: object
      properties:
        path:
          $ref: "#/components/schemas/LearningPathKey"
        pathTitle:
          type: string
        focusField:
          type: string
          nullable: true
        level:
          type: number
        title:
          type: string
        total:
          type: number
        reachedAt:
          type: string
          format: date-time
    LearningProfile:
      type: object
      properties:
        path:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/LearningPathKey"
          description: Null until the user picks a path.
        title:
          type: string
          nullable: true
        tagline:
          type: string
          nullable: true
        focusField:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        stats:
          type: object
          description: Lifetime learning activity (never reset).
          properties:
            contents:
              type: number
            correctAnswers:
              type: number
            papers:
              type: number
            fieldsExplored:
              type: number
            fields:
              type: array
              description: Per department, most active first.
              items:
                type: object
                properties:
                  field:
                    type: string
                  contents:
                    type: number
                  correctAnswers:
                    type: number
                  papers:
                    type: number
        journey:
          type: object
          nullable: true
          description: Null without a path.
          properties:
            level:
              type: number
              description: Milestones reached.
            total:
              type: number
            completed:
              type: boolean
            next:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/LearningMilestone"
            milestones:
              type: array
              items:
                $ref: "#/components/schemas/LearningMilestone"
        history:
          type: array
          description: Previous paths, most recent first (20 at most).
          items:
            type: object
            properties:
              path:
                type: string
              title:
                type: string
              focusField:
                type: string
                nullable: true
              startedAt:
                type: string
                format: date-time
                nullable: true
              endedAt:
                type: string
                format: date-time
              milestonesReached:
                type: number
    Role:
      type: string
      enum: [College Student, Professor, Researcher, Learning Enthusiast, PhD Student]
    Rating:
      type: object
      properties:
        value:
          type: number
          minimum: 0
          maximum: 10
        count:
          type: integer
    RatingAction:
      type: object
      properties:
        action:
          type: string
          enum: ["+", "-"]
      required: [action]
    RatingUpdateResponse:
      type: object
      properties:
        message:
          type: string
        rating:
          $ref: "#/components/schemas/Rating"
    Evaluation:
      type: object
      properties:
        question:
          type: string
        responses:
          type: array
          items:
            type: string
        correct:
          type: string
    Cast:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        description:
          type: string
        department:
          type: string
        brightmindid:
          type: string
        casturl:
          type: string
        castimageurl:
          type: string
        university:
          type: string
        category:
          type: string
        visibility:
          type: string
        link:
          type: string
        duration:
          type: number
        dateadded:
          type: string
          format: date-time
        rating:
          $ref: "#/components/schemas/Rating"
        evaluation:
          $ref: "#/components/schemas/Evaluation"
        topic:
          type: string
        subtitleurl:
          type: string
        processing:
          $ref: "#/components/schemas/Processing"
    Processing:
      type: object
      description: |
        Background AI processing (transcript, subtitles, evaluation, department, topic, image).
        Failed steps are retried with backoff, then once a day; `failed` means the item itself
        could not be processed after several days and needs attention.
      properties:
        status:
          type: string
          enum: [pending, processing, done, failed]
        attempts:
          type: integer
          description: Failures caused by the item itself (OpenAI outages are not counted).
        lastError:
          type: string
        lastAttemptAt:
          type: string
          format: date-time
    CastCreate:
      type: object
      description: Content of the `cast` multipart field for `POST /cast`.
      properties:
        title:
          type: string
          maxLength: 85
          description: Must be unique (409 otherwise).
        brightmindid:
          type: string
        university:
          type: string
        category:
          type: string
        visibility:
          type: string
        link:
          type: string
        department:
          allOf:
            - $ref: "#/components/schemas/Department"
          description: Optional; left empty, the cast is stored with `Pending Department`.
        topic:
          type: string
          description: Optional; when omitted the topic (and department) are generated in the background.
        dateadded:
          type: string
          format: date-time
      required: [title, brightmindid, university, category, visibility]
    CastUpdate:
      type: object
      description: Content of the `cast` multipart field for `PUT /cast/{id}`. All fields optional.
      properties:
        title:
          type: string
          maxLength: 85
        description:
          type: string
        brightmindid:
          type: string
        university:
          type: string
        category:
          type: string
        visibility:
          type: string
        link:
          type: string
        castimageurl:
          type: string
        department:
          $ref: "#/components/schemas/Department"
        topic:
          type: string
        dateadded:
          type: string
          format: date-time
    Article:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        department:
          type: string
        brightmindid:
          type: string
        description:
          type: string
        articleimageurl:
          type: string
          description: Generated in the background; absent until then.
        university:
          type: string
        category:
          type: string
        visibility:
          type: string
        link:
          type: string
        duration:
          type: number
        dateadded:
          type: string
          format: date-time
        rating:
          $ref: "#/components/schemas/Rating"
        evaluation:
          $ref: "#/components/schemas/Evaluation"
        topic:
          type: string
        processing:
          $ref: "#/components/schemas/Processing"
    ArticleCreate:
      type: object
      properties:
        title:
          type: string
          maxLength: 85
        description:
          type: string
        brightmindid:
          type: string
        university:
          type: string
        category:
          type: string
        visibility:
          type: string
        link:
          type: string
        department:
          allOf:
            - $ref: "#/components/schemas/Department"
          description: Optional; left empty, the article is stored with `Pending Department`.
        topic:
          type: string
          description: Optional; when omitted the topic (and department) are generated in the background.
        duration:
          type: number
          description: Optional; computed from the description when omitted.
        dateadded:
          type: string
          format: date-time
      required:
        - title
        - description
        - brightmindid
        - university
        - category
        - visibility
    ArticleUpdate:
      type: object
      description: Partial update; all fields optional.
      properties:
        title:
          type: string
          maxLength: 85
        description:
          type: string
        brightmindid:
          type: string
        university:
          type: string
        category:
          type: string
        visibility:
          type: string
        link:
          type: string
        department:
          $ref: "#/components/schemas/Department"
        topic:
          type: string
        duration:
          type: number
        dateadded:
          type: string
          format: date-time
    User:
      type: object
      description: Public user representation (credentials and tokens are never returned).
      properties:
        _id:
          type: string
        email:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        university:
          type: string
        profilePictureUrl:
          type: string
        isVerified:
          type: boolean
        evaluation_list:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationItem"
        bookmarkedcontent:
          type: array
          items:
            $ref: "#/components/schemas/Bookmark"
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/Preference"
        learning:
