  /user/{id}/quiz:
    post:
      tags: [User]
      summary: Submit quiz answers and earn rewards
      description: >-
        Grades the answers against the stored `evaluation.correct` of each cast/article and awards XP
        (+10 per correct answer, +2 per wrong answer, combo bonus +5 per consecutive correct answer up to +20,
        +20 for a perfect quiz of 2+ questions, daily streak bonus +5 per streak day up to +35 on the first
        quiz of the day), updates the daily streak, unlocks badges and adds the correct answers to
        `tracking.progress`. Only questions still pending in the user's evaluation list are graded; correct
        ones are marked as answered. Answers for other content are ignored, so a replay earns nothing.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: array
                  minItems: 1
                  maxItems: 50
                  description: In the order they were answered (the order drives the combo bonus).
                  items:
                    type: object
                    properties:
                      contentId:
                        type: string
                      response:
                        type: string
                        description: The chosen answer, one of the evaluation `responses`.
                    required: [contentId, response]
                utcOffsetMinutes:
                  type: integer
                  minimum: -840
                  maximum: 840
                  description: Minutes east of UTC (e.g. 120 for UTC+2), so the streak follows the user's day.
                quizId:
                  type: string
                  pattern: "^[A-Za-z0-9_-]{8,64}$"
                  description: >-
                    Client-generated id of this quiz attempt. Resending the last graded quiz id (retry after a
                    lost response) earns nothing and answers `duplicate: true`.
              required: [answers]
      responses:
        "200":
          description: Graded quiz and updated rewards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The same quiz was submitted concurrently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /user/{id}/rewards:
    get:
      tags: [User]
      summary: Get the user's XP, level, streak and badges
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: utcOffsetMinutes
