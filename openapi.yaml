      tags: [User]
      summary: Add bookmark
      description: |
        If `type` is omitted, it is inferred from the collection the content belongs to.
        Returns 400 if the content is already bookmarked.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    contentId:
                      type: string
                    type:
                      type: string
                      enum: [cast, article]
                  required: [contentId]
                - type: object
                  properties:
                    castId:
                      type: string
                      deprecated: true
                  required: [castId]
                - type: object
                  properties:
                    articleId:
                      type: string
                      deprecated: true
                  required: [articleId]
      responses:
        "201":
          description: Bookmark added
