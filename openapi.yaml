  # ------------------------------------------------------------------ Topic
  /topic:
    post:
      tags: [Topic]
      summary: Create topic (or return the existing one)
      description: |
        Topics are identified by (`name`, `departmentName`). If the topic already exists
        it is returned with status 200 (its `openalexID` is filled in if it had none);
        otherwise it is created (201).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                departmentName:
                  $ref: "#/components/schemas/Department"
                openalexID:
                  type: string
              required: [name, departmentName]
      responses:
        "201":
          description: Topic created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicResult"
        "200":
          description: Topic already existed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [Topic]
      summary: List topics
      responses:
        "200":
          description: Topics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"
  /topic/department/{departmentName}:
    get:
      tags: [Topic]
      summary: Get topics by department
      parameters:
        - name: departmentName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Topics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"
  /topic/{id}:
    get:
      tags: [Topic]
      summary: Get topic by ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Topic]
      summary: Update topic
      description: Only `name`, `departmentName` and `openalexID` can be changed; other fields are ignored.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicUpdate"
      responses:
        "200":
          description: Topic updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT returned by `POST /user/login` (`token` field). Only enforced when the server
        runs with `AUTH_REQUIRED=true`.
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: MongoDB ObjectId (24 hex characters). Malformed ids return 400.
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
    CategoryParam:
      name: id
      in: path
      required: true
      description: Category name.
      schema:
        type: string
    DepartmentParam:
      name: id
      in: path
      required: true
      description: Department name (see `Department`).
      schema:
        type: string
    BrightmindIdParam:
      name: id
      in: path
      required: true
      description: Creator id (`brightmindid`).
      schema:
        type: string
    TokenParam:
      name: token
      in: path
      required: true
      description: Token from the email link.
      schema:
        type: string
    LabIdParam:
      name: labId
      in: path
      required: true
      description: Virtual lab ObjectId (24 hex characters). Malformed ids return 400.
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
    InstituteIdParam:
      name: instituteId
      in: path
      required: true
      description: The institute's `instituteID` value (not the subdocument `_id`).
      schema:
        type: string
    LabTopicIdParam:
      name: topicId
      in: path
      required: true
      description: The virtual lab topic's subdocument `_id`.
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request (malformed id, validation error, malformed JSON / multipart JSON field, unsupported file type)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Invalid id.
            message: Invalid id.
    Unauthorized:
      description: Missing, invalid or expired token (only when `AUTH_REQUIRED=true`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Authentication required.
            message: Authentication required.
    Forbidden:
      description: The token's user does not match `{id}` (only when `AUTH_REQUIRED=true`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: You can only access your own account.
            message: You can only access your own account.
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Not found.
            message: Not found.
    Conflict:
      description: Resource already exists (e.g. duplicate cast title, signup email or virtual lab name)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Resource already exists.
            message: Resource already exists.
    PayloadTooLarge:
      description: Uploaded file exceeds the size limit (1024 MB for videos, 10 MB for images)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: File too large
            message: File too large
    TooManyRequests:
      description: Rate limit exceeded (20 requests per 15 minutes)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Too many attempts, please try again later.
            message: Too many attempts, please try again later.
    InternalServerError:
      description: Unexpected server error (e.g. email could not be sent)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      description: Error body. `error` and `message` carry the same text (backward compatibility).
      properties:
        error:
          type: string
        message:
          type: string
      required: [error, message]
    MessageResponse:
      type: object
      description: Success message; endpoints use either `message` or `response`.
      properties:
        message:
          type: string
        response:
          type: string
    CreatedResponse:
      type: object
      properties:
        response:
          type: string
        id:
          type: string
          description: ObjectId of the created resource.
      required: [response, id]
    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        db:
          type: string
          enum: [up, down]
    Department:
      type: string
      enum:
        - Medicine
        - SocialSciences
        - Engineering
        - ArtsandHumanities
        - ComputerScience
        - BiochemistryGeneticsandMolecularBiology
        - AgriculturalandBiologicalSciences
        - EnvironmentalScience
        - MaterialsScience
        - PhysicsandAstronomy
        - BusinessManagementandAccounting
        - HealthProfessions
        - EconomicsEconometricsandFinance
        - Psychology
        - Chemistry
        - EarthandPlanetarySciences
        - Neuroscience
        - Mathematics
        - ImmunologyandMicrobiology
        - DecisionSciences
        - Energy
        - Nursing
        - PharmacologyToxicologyandPharmaceutics
        - Dentistry
        - ChemicalEngineering
        - Veterinary
    Objective:
      type: string
      enum: [Follower, Explorer, Deep Learner, Researcher, Career]
    Role:
      type: string
      enum: [College Student, Professor, Researcher, Learning Enthusiast, PhD Student]
    Rating:
      type: object
      properties:
        value:
          type: number
          minimum: 0
          maximum: 10
        count:
          type: integer
    RatingAction:
      type: object
      properties:
        action:
          type: string
          enum: ["+", "-"]
      required: [action]
    RatingUpdateResponse:
      type: object
      properties:
        message:
          type: string
        rating:
          $ref: "#/components/schemas/Rating"
    Evaluation:
      type: object
      properties:
        question:
          type: string
        responses:
          type: array
          items:
            type: string
        correct:
          type: string
    Cast:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        description:
          type: string
        department:
          type: string
        brightmindid:
          type: string
        casturl:
          type: string
        castimageurl:
          type: string
        university:
          type: string
        category:
          type: string
        visibility:
          type: string
        link:
          type: string
        duration:
          type: number
        dateadded:
          type: string
          format: date-time
        rating:
          $ref: "#/components/schemas/Rating"
        evaluation:
          $ref: "#/components/schemas/Evaluation"
        topic:
          type: string
        subtitleurl:
          type: string
        processing:
          $ref: "#/components/schemas/Processing"
    Processing:
      type: object
      description: |
        Background AI processing (transcript, subtitles, evaluation, department, topic, image).
        Failed steps are retried with backoff, then once a day; `failed` means the item itself
        could not be processed after several days and needs attention.
      properties:
        status:
          type: string
          enum: [pending, processing, done, failed]
        attempts:
          type: integer
          description: Failures caused by the item itself (OpenAI outages are not counted).
        lastError:
          type: string
        lastAttemptAt:
          type: string
          format: date-time
    CastCreate:
      type: object
      description: Content of the `cast` multipart field for `POST /cast`.
      properties:
        title:
          type: string
          maxLength: 85
          description: Must be unique (409 otherwise).
        brightmindid:
          type: string
        university:
          type: string
        category:
          type: string
        visibility:
          type: string
        link:
          type: string
        department:
          allOf:
            - $ref: "#/components/schemas/Department"
          description: Optional; left empty, the cast is stored with `Pending Department`.
        topic:
          type: string
          description: Optional; when omitted the topic (and department) are generated in the background.
        dateadded:
          type: string
          format: date-time
      required: [title, brightmindid, university, category, visibility]
    CastUpdate:
      type: object
      description: Content of the `cast` multipart field for `PUT /cast/{id}`. All fields optional.
      properties:
        title:
          type: string
          maxLength: 85
        description:
          type: string
        brightmindid:
          type: string
        university:
          type: string
        category:
          type: string
        visibility:
          type: string
        link:
          type: string
        castimageurl:
          type: string
        department:
          $ref: "#/components/schemas/Department"
        topic:
          type: string
        dateadded:
          type: string
          format: date-time
    Article:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        department:
          type: string
        brightmindid:
          type: string
        description:
          type: string
        articleimageurl:
          type: string
          description: Generated in the background; absent until then.
        university:
          type: string
        category:
          type: string
        visibility:
          type: string
        link:
          type: string
        duration:
          type: number
        dateadded:
          type: string
          format: date-time
        rating:
          $ref: "#/components/schemas/Rating"
        evaluation:
          $ref: "#/components/schemas/Evaluation"
        topic:
          type: string
        processing:
          $ref: "#/components/schemas/Processing"
    ArticleCreate:
      type: object
      properties:
        title:
          type: string
          maxLength: 85
        description:
          type: string
        brightmindid:
          type: string
        university:
          type: string
        category:
          type: string
        visibility:
          type: string
        link:
          type: string
        department:
          allOf:
            - $ref: "#/components/schemas/Department"
          description: Optional; left empty, the article is stored with `Pending Department`.
        topic:
          type: string
          description: Optional; when omitted the topic (and department) are generated in the background.
        duration:
          type: number
          description: Optional; computed from the description when omitted.
        dateadded:
          type: string
          format: date-time
      required:
        - title
        - description
        - brightmindid
        - university
        - category
        - visibility
    ArticleUpdate:
      type: object
      description: Partial update; all fields optional.
      properties:
        title:
          type: string
          maxLength: 85
        description:
          type: string
        brightmindid:
          type: string
        university:
          type: string
        category:
          type: string
        visibility:
          type: string
        link:
          type: string
        department:
          $ref: "#/components/schemas/Department"
        topic:
          type: string
        duration:
          type: number
        dateadded:
          type: string
          format: date-time
    User:
      type: object
      description: Public user representation (credentials and tokens are never returned).
      properties:
        _id:
          type: string
        email:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        university:
          type: string
        profilePictureUrl:
          type: string
        isVerified:
          type: boolean
        evaluation_list:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationItem"
        bookmarkedcontent:
          type: array
          items:
            $ref: "#/components/schemas/Bookmark"
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/Preference"
        tracking:
          $ref: "#/components/schemas/UserTracking"
        castPublications:
          type: array
          items:
            type: string
        articlePublications:
          type: array
          items:
            type: string
    UserSignup:
      type: object
      description: Content of the `user` multipart field for `POST /user/signup`.
      properties:
        email:
          type: string
          format: email
          description: Must be unique (409 otherwise) and have a valid domain.
        password:
          type: string
          format: password
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        university:
          type: string
          description: Only stored for the Professor, PhD Student and Researcher roles.
        objective:
          $ref: "#/components/schemas/Objective"
      required: [email, password, username, role]
    UserUpdate:
      type: object
      description: Fields a user may change on their own profile. All optional.
      properties:
        email:
          type: string
          format: email
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        university:
          type: string
        evaluation_list:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationItem"
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/Preference"
        tracking:
          $ref: "#/components/schemas/UserTracking"
        castPublications:
          type: array
          items:
            type: string
        articlePublications:
          type: array
          items:
            type: string
    PasswordReset:
      type: object
      properties:
        password:
          type: string
          format: password
          minLength: 4
        confirmPassword:
          type: string
          format: password
      required: [password, confirmPassword]
    EvaluationItem:
      type: object
      properties:
        contentid:
          type: string
        type:
          type: string
        watched:
          type: boolean
        answered:
          type: boolean
    Bookmark:
      type: object
      properties:
        contentid:
          type: string
        type:
          type: string
          enum: [cast, article]
        bookmarkedAt:
          type: string
          format: date-time
    BookmarkExpanded:
      type: object
      properties:
        contentid:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
          enum: [cast, article]
        bookmarkedAt:
          type: string
          format: date-time
          nullable: true
        content:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/Cast"
            - $ref: "#/components/schemas/Article"
    BookmarkAddResponse:
      type: object
      properties:
        message:
          type: string
        bookmark:
          type: object
          properties:
            contentid:
              type: string
            type:
              type: string
              enum: [cast, article]
    Preference:
      type: object
      properties:
        category:
          type: string
        weight:
          type: number
        count:
          type: number
    UserTracking:
      type: object
      properties:
        objective:
          type: string
        progress:
          type: number
        target:
          type: number
        history:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              count:
                type: number
    University:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        displayedName:
          type: string
        iconurl:
          type: string
    UniversityInput:
      type: object
      properties:
        name:
          type: string
        displayedName:
          type: string
        iconurl:
          type: string
          description: Only used by `PUT` when no icon file is uploaded.
    VirtualLab:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        followers:
          type: array
          items:
            $ref: "#/components/schemas/VLUserRef"
        members:
          type: array
          items:
            $ref: "#/components/schemas/VLUserRef"
        institute:
          type: array
          items:
            $ref: "#/components/schemas/VLInstitute"
        topics:
          type: array
          items:
            $ref: "#/components/schemas/VLTopic"
        iconurl:
          type: string
        colorcode:
          type: string
    VirtualLabInput:
      type: object
      properties:
        name:
          type: string
          description: Must be unique (409 otherwise).
        followers:
          type: array
          items:
            $ref: "#/components/schemas/VLUserRef"
        members:
          type: array
          items:
            $ref: "#/components/schemas/VLUserRef"
        topics:
          type: array
          items:
            $ref: "#/components/schemas/VLTopic"
        colorcode:
          type: string
        iconurl:
          type: string
          description: Only used by `PUT` when no icon file is uploaded.
    VLUserRef:
      type: object
      properties:
        userID:
          type: string
    VLInstitute:
      type: object
      properties:
        instituteID:
          type: string
        score:
          type: number
    VLTopic:
      type: object
      properties:
        _id:
          type: string
          readOnly: true
        name:
          type: string
        gage:
          type: number
        institutes:
          type: array
          items:
            type: object
            properties:
              instituteId:
                type: string
        description:
          type: string
        followers:
          type: array
          items:
            $ref: "#/components/schemas/VLUserRef"
        members:
          type: array
          items:
            $ref: "#/components/schemas/VLUserRef"
        threads:
          type: array
          items:
            type: object
            properties:
              content:
                type: string
    VLTopicInput:
      type: object
      properties:
        name:
          type: string
        gage:
          type: number
          default: 0
        institutes:
          type: array
          items:
            type: object
            properties:
              instituteId:
                type: string
        description:
          type: string
      required: [name]
    Topic:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        departmentName:
          type: string
        articleCount:
          type: integer
        castCount:
          type: integer
        articleIDs:
          type: array
          items:
            type: string
        castIDs:
          type: array
          items:
            type: string
        openalexID:
          type: string
        activity:
          type: number
        impact:
          type: number
        metrics:
          type: object
          properties:
            openalex:
              type: object
              properties:
                citedByCount:
                  type: number
                worksCount:
                  type: number
                worksLast12Months:
                  type: number
                lastFetchedAt:
                  type: string
                  format: date-time
                  nullable: true
                lastWorksFetchedAt:
                  type: string
                  format: date-time
                  nullable: true
            wikipedia:
              type: object
              properties:
                title:
                  type: string
                  nullable: true
                views12Months:
                  type: number
                lastFetchedAt:
                  type: string
                  format: date-time
                  nullable: true
            lastComputedAt:
              type: string
              format: date-time
              nullable: true
            lastError:
              type: string
              nullable: true
            backoffUntil:
              type: string
              format: date-time
              nullable: true
    TopicResult:
      type: object
      properties:
        message:
          type: string
        topic:
          $ref: "#/components/schemas/Topic"
    TopicUpdate:
      type: object
      properties:
        name:
          type: string
        departmentName:
          $ref: "#/components/schemas/Department"
        openalexID:
          type: string
