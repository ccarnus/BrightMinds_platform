  # ------------------------------------------------------------------ University
  /university:
    post:
      tags: [University]
      summary: Create university
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                university:
                  type: string
                  description: JSON-encoded `UniversityInput` object (`name` and `displayedName` required).
                  example: '{"name":"MIT","displayedName":"Massachusetts Institute of Technology"}'
                icon:
                  type: string
                  format: binary
                  description: Icon image (image/jpeg or image/png, max 10 MB).
              required: [university, icon]
            encoding:
              icon:
                contentType: image/jpeg, image/png
      responses:
        "201":
          description: University created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    get:
      tags: [University]
      summary: List universities
      responses:
        "200":
          description: Universities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/University"
  /university/by/name/{id}:
    get:
      tags: [University]
      summary: Get university by name
      parameters:
        - name: id
          in: path
          required: true
          description: University `name` (not an ObjectId).
          schema:
            type: string
      responses:
        "200":
          description: University
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/University"
        "404":
          $ref: "#/components/responses/NotFound"
  /university/{id}:
    get:
      tags: [University]
      summary: Get university by ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: University
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/University"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [University]
      summary: Update university (partial)
      description: |
        Send multipart (optional `icon` + `university` JSON string) or a plain JSON body.
        A new icon replaces (and deletes) the previous one.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                university:
                  type: string
                  description: JSON-encoded `UniversityInput` object (fields to change).
                  example: '{"displayedName":"MIT"}'
                icon:
                  type: string
                  format: binary
                  description: Optional new icon (image/jpeg or image/png, max 10 MB).
            encoding:
              icon:
                contentType: image/jpeg, image/png
          application/json:
            schema:
              $ref: "#/components/schemas/UniversityInput"
      responses:
        "201":
          description: University updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      tags: [University]
      summary: Delete university
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: University deleted
          content:
