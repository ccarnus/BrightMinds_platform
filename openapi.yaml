          nullable: true
        metricsAt:
          type: string
          format: date-time
          nullable: true
        signalsAt:
          type: string
          format: date-time
          nullable: true
        windowsEndOn:
          type: string
          nullable: true
        lastError:
          type: string
          nullable: true
        lastErrorAt:
          type: string
          format: date-time
          nullable: true
        topics:
          type: object
          properties:
            catalog:
              type: integer
            scored:
              type: integer
            featured:
              type: integer
            withCasts:
              type: integer
            authored:
              type: integer
        openalexKey:
          type: boolean
          description: Whether an OpenAlex API key is configured (a free key gives a bigger daily budget).
    TopicResult:
      type: object
      properties:
        message:
          type: string
        topic:
          $ref: "#/components/schemas/Topic"
    TopicUpdate:
      type: object
      properties:
        name:
          type: string
        departmentName:
          $ref: "#/components/schemas/Department"
        openalexID:
          type: string
