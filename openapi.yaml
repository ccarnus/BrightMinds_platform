              schema:
                type: object
                properties:
                  recorded:
                    type: boolean
                  newMilestones:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReachedMilestone"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
