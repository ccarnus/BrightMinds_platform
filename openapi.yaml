openapi: 3.0.3
info:
  title: BrightMinds Backend API
  version: 1.0.0
  description: |
    OpenAPI specification for the BrightMinds backend.

    **Authentication.** Operations marked with `bearerAuth` expect an
    `Authorization: Bearer <token>` header, where the JWT is obtained from
    `POST /user/login`. Authentication is only enforced when the server runs with
    `AUTH_REQUIRED=true`; otherwise a missing or invalid token is ignored. When
    enforced, a missing or invalid/expired token yields `401`.

    **Own-account routes.** User routes that take the account id as `{id}`
    (profile update/delete, evaluation list, bookmarks, preferences, learning path,
    suggestions) additionally require the token's user to match `{id}`;
    otherwise the server answers `403` (also only when `AUTH_REQUIRED=true`).

    **Errors.** JSON errors use the `Error` schema: `{ "error": "...", "message": "..." }`.
    Both keys carry the same text, for backward compatibility with clients that read
    either one. Common cases: `400` for malformed ObjectIds, validation errors,
    malformed JSON bodies and malformed multipart JSON fields; `404` when a resource
    (or route) does not exist; `409` on duplicates; `413` when an upload or JSON
    body (1 MB) is too large; `500` for unexpected errors.
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.greenlights.us
    description: Production
tags:
  - name: System
  - name: Cast
  - name: Article
  - name: User
  - name: Learning
  - name: University
  - name: VirtualLab
  - name: Topic

paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      description: Reports whether the API is up and connected to the database.
      responses:
        "200":
          description: API and database are up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                db: up
        "503":
          description: Database is not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: degraded
                db: down

  # ------------------------------------------------------------------ Cast
  /cast:
    post:
      tags: [Cast]
      summary: Create a cast
      description: |
        Multipart upload of the video plus a `cast` form field holding a JSON-encoded
        `CastCreate` object. Duration is read from the video; transcription, image,
        evaluation and (if no topic is given) topic generation run in a background queue.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                cast:
                  type: string
                  description: JSON-encoded `CastCreate` object.
                  example: '{"title":"My cast","brightmindid":"665f1c2e9b1e8a0012345678","university":"MIT","category":"Research","visibility":"public","department":"ComputerScience"}'
                video:
                  type: string
                  format: binary
                  description: Video file (video/mp4, video/mpeg or video/webm, max 1024 MB).
              required: [cast, video]
            encoding:
              video:
                contentType: video/mp4, video/mpeg, video/webm
      responses:
        "201":
          description: Cast created; background processing started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    get:
      tags: [Cast]
      summary: List all casts
      responses:
        "200":
          description: List of casts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cast"
  /cast/all/simplified:
    get:
      tags: [Cast]
      summary: Get simplified cast list
      responses:
        "200":
          description: Count and simplified cast list
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  casts:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        title:
                          type: string
  /cast/trending/right/now:
    get:
      tags: [Cast]
      summary: Get trending casts
      description: All casts, newest first.
      responses:
        "200":
          description: Trending casts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cast"
  /cast/popular/department:
    get:
      tags: [Cast]
      summary: Get most popular departments
      description: Number of casts per department, most popular first.
      responses:
        "200":
          description: Department popularity
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                      description: Department name
                    count:
                      type: integer
  /cast/category/{id}:
    get:
      tags: [Cast]
      summary: Get casts by category
      parameters:
        - $ref: "#/components/parameters/CategoryParam"
      responses:
        "200":
          description: List of casts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cast"
  /cast/department/{id}:
    get:
      tags: [Cast]
      summary: Get casts by department
      parameters:
        - $ref: "#/components/parameters/DepartmentParam"
        - name: topic
          in: query
          required: false
          description: Only return casts of this topic.
          schema:
            type: string
      responses:
        "200":
          description: List of casts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cast"
  /cast/brightmindid/{id}:
    get:
      tags: [Cast]
      summary: Get casts by creator (brightmindid)
      parameters:
        - $ref: "#/components/parameters/BrightmindIdParam"
      responses:
        "200":
          description: List of casts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cast"
  /cast/evaluation/{id}:
    get:
      tags: [Cast]
      summary: Get evaluation for a cast
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Evaluation
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluation:
                    $ref: "#/components/schemas/Evaluation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /cast/{id}:
    get:
      tags: [Cast]
      summary: Get cast by ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Cast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cast"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Cast]
      summary: Update cast (partial)
      description: |
        Partial update. Only the fields present in the `cast` JSON field are changed.
        An optional new `video` replaces the previous one (its duration is re-read and
        the old file is deleted).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                cast:
                  type: string
                  description: JSON-encoded `CastUpdate` object (fields to change).
                  example: '{"title":"New title","topic":"Machine Learning"}'
                video:
                  type: string
                  format: binary
                  description: Optional replacement video (video/mp4, video/mpeg or video/webm, max 1024 MB).
            encoding:
              video:
                contentType: video/mp4, video/mpeg, video/webm
      responses:
        "200":
          description: Cast updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      tags: [Cast]
      summary: Delete cast
      description: Deletes the cast, its media files, user references and topic link.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Cast deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /cast/{id}/rating:
    get:
      tags: [Cast]
      summary: Get cast rating
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Rating
          content:
            application/json:
              schema:
                type: object
                properties:
                  rating:
                    $ref: "#/components/schemas/Rating"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Cast]
      summary: Rate a cast
      description: "`+` counts as a 10/10 vote, `-` as 0/10; averaged into `rating.value`."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingAction"
      responses:
        "200":
          description: Rating updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingUpdateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------------------ Article
  /article:
    post:
      tags: [Article]
      summary: Create an article
      description: |
        The article is saved immediately. Its evaluation question, image and (if not given)
        department and topic are generated with OpenAI in a background queue, retried
        automatically (see `processing` on the article).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleCreate"
      responses:
        "201":
          description: Article created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [Article]
      summary: List all articles
      responses:
        "200":
          description: List of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"
  /article/trending/right/now:
    get:
      tags: [Article]
      summary: Get trending articles
      description: Articles added in the last 14 days, best rated first.
      responses:
        "200":
          description: Trending articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"
  /article/category/{id}:
    get:
      tags: [Article]
      summary: Get articles by category
      parameters:
        - $ref: "#/components/parameters/CategoryParam"
      responses:
        "200":
          description: List of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"
  /article/department/{id}:
    get:
      tags: [Article]
      summary: Get articles by department
      parameters:
        - $ref: "#/components/parameters/DepartmentParam"
      responses:
        "200":
          description: List of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"
  /article/brightmindid/{id}:
    get:
      tags: [Article]
      summary: Get articles by creator (brightmindid)
      parameters:
        - $ref: "#/components/parameters/BrightmindIdParam"
      responses:
        "200":
          description: List of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"
  /article/evaluation/{id}:
    get:
      tags: [Article]
      summary: Get evaluation for an article
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Evaluation
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluation:
                    $ref: "#/components/schemas/Evaluation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /article/{id}:
    get:
      tags: [Article]
      summary: Get article by ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Article]
      summary: Update article (partial)
      description: Partial update. Only the fields present in the body are changed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleUpdate"
      responses:
        "201":
          description: Article updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Article]
      summary: Delete article
      description: Deletes the article, its image, user references and topic link.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Article deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /article/{id}/rating:
    get:
      tags: [Article]
      summary: Get article rating
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Rating
          content:
            application/json:
              schema:
                type: object
                properties:
                  rating:
                    $ref: "#/components/schemas/Rating"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Article]
      summary: Rate an article
      description: "`+` counts as a 10/10 vote, `-` as 0/10; averaged into `rating.value`."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingAction"
      responses:
        "200":
          description: Rating updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingUpdateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------------------ User
  /user/signup:
    post:
      tags: [User]
      summary: Create a user account
      description: |
        Multipart upload of the profile picture plus a `user` form field holding a
        JSON-encoded `UserSignup` object. Sends a verification email; if sending fails
        the account is rolled back (500). Rate limited.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                user:
                  type: string
                  description: JSON-encoded `UserSignup` object.
                  example: '{"email":"jane@university.edu","password":"secret","username":"jane","role":"Researcher","university":"MIT","path":"explorer"}'
                image:
                  type: string
                  format: binary
                  description: Profile picture (image/jpeg or image/png, max 10 MB).
              required: [user, image]
            encoding:
              image:
                contentType: image/jpeg, image/png
      responses:
        "201":
          description: User created; verification email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /user/confirmation/{token}:
    get:
      tags: [User]
      summary: Confirm user email
      description: Opened from the verification email; renders an HTML page.
      parameters:
        - $ref: "#/components/parameters/TokenParam"
      responses:
        "200":
          description: Account verified (HTML page)
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Unknown token or account already verified (HTML page)
          content:
            text/html:
              schema:
                type: string
        "500":
          description: Server error (HTML page)
          content:
            text/html:
              schema:
                type: string
  /user/login:
    post:
      tags: [User]
      summary: Login
      description: "Returns the JWT to send as `Authorization: Bearer <token>`. Rate limited."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required: [email, password]
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  email:
                    type: string
                  token:
                    type: string
                    description: JWT for the `bearerAuth` scheme.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unknown email or incorrect password
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    enum: [user not found., incorrect password]
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /user:
    get:
      tags: [User]
      summary: List users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /user/{id}:
    get:
      tags: [User]
      summary: Get user by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [User]
      summary: Update own user (partial)
      description: |
        Partial update of the authenticated user's own account. Send multipart
        (optional `image` + `user` JSON string) or a JSON body with the fields wrapped
        in a `user` object. Password and verification fields cannot be changed here.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                user:
                  type: string
                  description: JSON-encoded `UserUpdate` object (fields to change).
                  example: '{"username":"jane.doe"}'
                image:
                  type: string
                  format: binary
                  description: Optional new profile picture (image/jpeg or image/png, max 10 MB).
            encoding:
              image:
                contentType: image/jpeg, image/png
          application/json:
            schema:
              type: object
              properties:
                user:
                  $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      tags: [User]
      summary: Delete own user
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /user/reset-password-request:
    post:
      tags: [User]
      summary: Request password reset
      description: Emails a reset link valid for one hour. Rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required: [email]
      responses:
        "200":
          description: Reset email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /user/reset-password/{token}:
    get:
      tags: [User]
      summary: Show reset password form
      description: Opened from the reset email; renders an HTML form.
      parameters:
        - $ref: "#/components/parameters/TokenParam"
      responses:
        "200":
          description: Reset form (HTML page)
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Invalid or expired link (HTML page)
          content:
            text/html:
              schema:
                type: string
        "500":
          description: Server error (HTML page)
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [User]
      summary: Reset password
      description: Submitted by the HTML reset form. Rate limited.
      parameters:
        - $ref: "#/components/parameters/TokenParam"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PasswordReset"
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordReset"
      responses:
        "200":
          description: Password updated (HTML page)
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Missing/mismatched/too short password, or invalid or expired link (HTML page)
          content:
            text/html:
              schema:
                type: string
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: Server error (HTML page)
          content:
            text/html:
              schema:
                type: string
  /user/add/content/{id}:
    post:
      tags: [User]
      summary: Add content to evaluation list
      description: |
        Marks the content as watched. The first time a content is added, it counts in the
        user's learning stats (in total and for the content's department), which may reach a
        milestone of the learning path (`newMilestones`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
