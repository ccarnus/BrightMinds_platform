name: Deploy

# Manual only: Actions > Deploy > Run workflow, pick the branch to ship.
# Re-runs CI on that commit, then SSHes into the server and rebuilds the docker compose stack.
# Setup steps (secrets, server) are listed in README.md > Remaining actions.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to production
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set (see README)."; missing=1; fi
          done
          exit $missing

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH,DEPLOY_SHA
          command_timeout: 20m
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            git fetch --prune origin
            git checkout --force --detach "$DEPLOY_SHA"
            docker compose up -d --build --wait --wait-timeout 180
            docker image prune -f
            curl --fail --silent --show-error "http://127.0.0.1:${API_PORT:-3000}/health"
            echo "Deployed $DEPLOY_SHA"
