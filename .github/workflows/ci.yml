name: CI

# Runs on every push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache MongoDB binaries (mongodb-memory-server)
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create CI environment file
        run: |
          {
            echo "JWT_SECRET=ci-only-secret"
            echo "PUBLIC_BASE_URL=http://localhost:3000"
          } > .env

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Smoke test
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/health
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/topic
          curl --fail --silent --show-error --output /dev/null \
            http://127.0.0.1:3000/backend/media/verification_email/BrightMinds_icon.png

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
